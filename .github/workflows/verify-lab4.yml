name: Verify CampusEQ API and Desktop
on:
  push:
    branches: [main, lab4/postgresql-workflows, lab5/api-integration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_INTEGRATION_ADMIN_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci-${{ github.run_id }}-${{ github.run_attempt }};Include Error Detail=false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore tools and packages
        run: |
          dotnet tool restore
          dotnet restore EquipmentBorrowing.slnx
      - name: Build complete solution including Avalonia
        run: dotnet build EquipmentBorrowing.slnx --no-restore --configuration Release
      - name: Verify model and all tests against PostgreSQL
        run: dotnet test tests/EquipmentBorrowing.Tests/EquipmentBorrowing.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=lab4.trx" --results-directory TestResults
      - name: Verify headless workflow controls and asynchronous bindings
        run: dotnet test tests/EquipmentBorrowing.UiTests/EquipmentBorrowing.UiTests.csproj --no-build --configuration Release --logger "trx;LogFileName=ui.trx" --results-directory TestResults
      - name: Verify persistence across separate application-service processes
        env:
          EQUIPMENT_BORROWING_CONNECTION_STRING: Host=localhost;Port=5432;Database=equipment_borrowing_verify_process_${{ github.run_id }}_${{ github.run_attempt }};Username=postgres;Password=ci-${{ github.run_id }}-${{ github.run_attempt }};Include Error Detail=false
        run: |
          for stage in init borrow verify-borrow return verify-return; do
            dotnet run --project tools/EquipmentBorrowing.PersistenceProbe --configuration Release --no-build -- "$stage"
          done
      - name: Install PostgreSQL client for HTTP acceptance verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Verify independent API contract and export OpenAPI
        run: python3 tools/verify-api-foundation.py --openapi-output TestResults/lab5/openapi.json
      - name: Run controlled Lab 5 HTTP acceptance scenarios
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          PSQL_PATH: psql
        run: |
          case_index=0
          for scenario in reads students equipment borrowings checkout client-all recovery; do
            case_index=$((case_index + 1))
            database="equipment_borrowing_verify_lab5_${{ github.run_id }}_${{ github.run_attempt }}_${case_index}"
            export LAB5_STUDENT_VERIFY_CONNECTION="Host=localhost;Port=5432;Database=$database;Username=postgres;Password=$PGPASSWORD;Include Error Detail=false"
            python3 tools/verify-student-api.py --resource "$scenario" --database "$database" --no-native --output "TestResults/lab5/$scenario.json"
          done
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campuseq-test-results
          path: TestResults
          if-no-files-found: ignore
